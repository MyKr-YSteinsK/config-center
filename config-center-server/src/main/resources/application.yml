server:
  port: 8080

spring:
  application:
    name: config-center-server

  profiles:
    default: local

  jpa:
    open-in-view: false

# 这里把限流值配得比较小，是为了本地演示时更容易打出 429 和对应 metrics。
rate-limit:
  enabled: true
  capacity: 5
  refill-per-second: 5
  max-buckets: 256

config-watch:
  max-pending-waiters: 256
  max-pending-per-namespace: 64

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: always

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] traceId=%X{traceId} %logger{36} - %msg%n"

security:
  api-keys:
    - key: ${CONFIG_CENTER_API_KEY:kr-dev-key}
      app: demo-app
      env: dev
