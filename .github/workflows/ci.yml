name: CI

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Build & Test
        run: ./mvnw -q -B clean verify

      # 即使构建失败，也尽量把测试报告和覆盖率报告带出来，方便回看。
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: |
            **/target/surefire-reports/*

      - name: Upload jacoco reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: |
            **/target/site/jacoco/*

  mysql-integration:
    runs-on: ubuntu-latest
    env:
      CONFIG_CENTER_DB_URL: jdbc:mysql://127.0.0.1:3306/config_center_it?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      CONFIG_CENTER_DB_USERNAME: config_center_it
      CONFIG_CENTER_DB_PASSWORD: mysql-it-${{ github.run_id }}-${{ github.run_attempt }}
      CONFIG_CENTER_API_KEY: mysql-it-${{ github.run_id }}-${{ github.run_attempt }}

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: config_center_it
          MYSQL_USER: config_center_it
          MYSQL_PASSWORD: mysql-it-${{ github.run_id }}-${{ github.run_attempt }}
          MYSQL_ROOT_PASSWORD: mysql-root-${{ github.run_id }}-${{ github.run_attempt }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Verify MySQL integration
        run: ./mvnw -q -B -Pmysql-it verify

      - name: Capture MySQL service log
        if: failure()
        run: docker logs "${{ job.services.mysql.id }}" > config-center-server/target/mysql-service.log 2>&1

      - name: Upload MySQL integration reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mysql-integration-reports
          if-no-files-found: ignore
          path: |
            **/target/surefire-reports/*
            **/target/failsafe-reports/*
            config-center-server/target/mysql-it.log
            config-center-server/target/mysql-service.log
